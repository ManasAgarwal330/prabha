# Static deploy: `nuxt generate` prerenders every route to plain HTML,
# so this runs entirely on Netlify's free tier with no serverless functions.
[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"
  # Netlify detects Nuxt and injects NITRO_PRESET=netlify, which redirects the
  # static output to dist/ and adds a server function. Pinning the preset keeps
  # the build fully static and the output exactly where `publish` points.
  NITRO_PRESET = "static"

# Hashed build assets never change — cache them hard.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
