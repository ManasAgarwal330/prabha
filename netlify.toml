# Server-rendered Nuxt: pages and the /api backend run as one Netlify Function,
# static assets are served from the CDN. Content comes from Azure Cosmos DB and
# images from Azure Blob Storage — set these in Netlify → Site configuration →
# Environment variables (see .env.example for what each one is):
#   NUXT_COSMOS_CONNECTION_STRING   (secret — never prefix with NUXT_PUBLIC_)
#   NUXT_COSMOS_DATABASE            (default: pravaah)
#   NUXT_CONTENT_CACHE_SECONDS      (default: 60)
#   NUXT_PUBLIC_IMAGE_BASE_URL      (https://<account>.blob.core.windows.net/images)
#   NUXT_PUBLIC_SITE_URL
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"

# Redirects for old URLs live in config/redirects.ts (Nuxt route rules) — with
# server rendering, rules here would sit behind the server catch-all and never run.

# Hashed build assets never change — cache them hard.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
